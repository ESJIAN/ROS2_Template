# ================================================================
# safety.yaml — 安全门控参数
# ================================================================

safety_gate_node:
  ros__parameters:
    topic_in: /result/inference
    topic_out: /command/safe
    min_confidence: 0.6             # 最低置信度门控
    min_command_interval_sec: 0.5   # 最小命令间隔（秒）
    suppress_repeated_commands: true # 是否抑制重复命令
