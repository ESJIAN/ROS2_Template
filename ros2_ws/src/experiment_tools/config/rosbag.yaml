# ================================================================
# rosbag.yaml — ROS2 bag 录制配置
# ================================================================

record:
  topics:
    - /sensor/raw
    - /sensor/processed
    - /result/inference
    - /command/safe
    - /command/control
    - /system/status
  output_dir: outputs/bags
  compression: zstd             # none | zstd | lz4

metrics:
  ground_truth_topic: /intention/ground_truth
  prediction_topic: /result/inference
  latency_topic: /result/inference
